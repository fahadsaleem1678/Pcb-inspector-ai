name: pcb-portfolio
x-backend: &backend
  build:
    context: ..
  image: pcb-portfolio-api:local
  env_file: .env.portfolio
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
services:
  migrate:
    <<: *backend
    restart: "no"
    command: ["python", "-m", "alembic", "upgrade", "head"]
  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
  worker:
    <<: *backend
    image: pcb-portfolio-worker:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    volumes:
      - type: bind
        source: ../ml/runs/dspcbsd-nineclass-research-3968steps-001/final-research.pt
        target: /models/final-research.pt
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      migrate:
        condition: service_completed_successfully
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env.portfolio
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
volumes:
  caddy-data:
  caddy-config:
