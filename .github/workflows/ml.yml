name: PCB Inspector ML checks
on:
  push:
    paths:
      - "ml/**"
      - "tests/test_ml_views.py"
      - "src/pcb_inspector/datasets.py"
      - "requirements.lock"
      - ".github/workflows/ml.yml"
  pull_request:
    paths:
      - "ml/**"
      - "tests/test_ml_views.py"
      - "src/pcb_inspector/datasets.py"
      - "requirements.lock"
      - ".github/workflows/ml.yml"
permissions:
  contents: read
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            ml/requirements.txt
            ml/requirements.lock
      - run: python -m pip install torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -c requirements.lock -c ml/requirements.lock -r ml/requirements.txt -e ".[dev]"
      - run: python -m pip check
      - run: python -m pytest tests/test_ml_views.py ml/tests -q
