name: PCB Inspector CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -c requirements.lock -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pytest -q
      - run: python -m pytest ml/tests/test_review.py ml/tests/test_adjudication.py -q
      - run: python scripts/smoke.py

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pcb
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: pcb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pcb -d pcb_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -c requirements.lock -e ".[dev]"
      - run: python scripts/smoke.py
        env:
          PCB_SMOKE_DATABASE_URL: postgresql+psycopg://pcb:ci-only@localhost:5432/pcb_test

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -t pcb-inspector:ci .

      - run: docker build -f frontend/Dockerfile -t pcb-inspector-web:ci .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -c requirements.lock -e ".[dev]"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: .venv/bin/python scripts/export_openapi.py
      - run: pnpm run generate:api
        working-directory: frontend
      - run: git diff --exit-code -- frontend/openapi.json frontend/src/generated/api.d.ts
      - run: pnpm run format:check
        working-directory: frontend
      - run: pnpm run lint
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm run test:e2e
        working-directory: frontend
      - run: pnpm run test:auth
        working-directory: frontend
